[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Rewrite /api/* directly to /.netlify/functions/:splat
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# Client-side SPA routing fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[functions."scheduled-ping"]
  # Wake every minute; the function reads the configured interval before writing.
  schedule = "* * * * *"
